name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      prev_tag: ${{ steps.get_version.outputs.prev_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Version Preparation Script
        id: get_version
        run: |
          chmod +x .github/workflows/release/prepare-release.sh
          .github/workflows/release/prepare-release.sh
  test:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests (100% coverage enforced)
        run: bun run test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
  release:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run release script
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PREV_TAG: ${{ needs.prepare-release.outputs.prev_tag }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REPO: ${{ github.repository }}
        run: |
          chmod +x .github/workflows/release/release.sh
          .github/workflows/release/release.sh
  docker:
    needs: [prepare-release, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image tags and labels
        id: meta
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          FULL_REPO: ${{ github.repository }}
        run: |
          chmod +x .github/workflows/release/docker-meta.sh
          .github/workflows/release/docker-meta.sh
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=integra
          cache-to: type=gha,scope=integra,mode=max
