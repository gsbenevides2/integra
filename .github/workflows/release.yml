name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      prev_tag: ${{ steps.get_version.outputs.prev_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Version Preparation Script
        id: get_version
        run: |
          chmod +x .github/workflows/release/prepare-release.sh
          .github/workflows/release/prepare-release.sh
  test:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests (100% coverage enforced)
        run: bun run test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
  release:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run release script
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PREV_TAG: ${{ needs.prepare-release.outputs.prev_tag }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REPO: ${{ github.repository }}
        run: |
          chmod +x .github/workflows/release/release.sh
          .github/workflows/release/release.sh
  docker:
    needs: [prepare-release, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      # Uploads the source maps of the released bundle, so RUM Error Tracking
      # resolves the minified stack traces back to public/… (docs/instrumentation.md).
      - name: Upload frontend source maps to OpenObserve
        env:
          NODE_ENV: production
          PUBLIC_RUM_SITE: ${{ vars.PUBLIC_RUM_SITE }}
          PUBLIC_OTEL_ORGANIZATION: ${{ vars.PUBLIC_OTEL_ORGANIZATION }}
          OPENOBSERVE_SOURCEMAP_TOKEN: ${{ secrets.OPENOBSERVE_SOURCEMAP_TOKEN }}
        run: |
          if [ -z "${OPENOBSERVE_SOURCEMAP_TOKEN}" ] || [ -z "${PUBLIC_RUM_SITE}" ] || [ -z "${PUBLIC_OTEL_ORGANIZATION}" ]; then
            echo "Source map upload skipped: set the OPENOBSERVE_SOURCEMAP_TOKEN secret and the"
            echo "PUBLIC_RUM_SITE / PUBLIC_OTEL_ORGANIZATION repository variables to enable it."
            exit 0
          fi
          bun install --frozen-lockfile
          bun run build:web
          bun run sourcemaps:upload
      - name: Run Build and Push Docker Image
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REPO: ${{ github.repository }}
        run: |
          chmod +x .github/workflows/release/docker.sh
          .github/workflows/release/docker.sh
