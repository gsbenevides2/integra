name: PR Build

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Run Build Docker Image
              env:
                  TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
              run: |
                  chmod +x .github/workflows/release/pr-build.sh
                  .github/workflows/release/pr-build.sh
