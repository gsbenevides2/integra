name: PR Build Test And Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Um push novo cancela o review anterior do mesmo PR, que já estaria desatualizado.
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: PR Agent Action Step
        uses: the-pr-agent/pr-agent@v0.39.0
        id: pr_agent
        env:
          # mimo-v2.5 raciocinava ~13k-54k tokens por chamada (6-15 min cada); o v2.6-flash raciocina ~2k.
          config.model: "openrouter/xiaomi/mimo-v2.6-flash"
          # O modelo não está na tabela MAX_TOKENS do PR-Agent; max_model_tokens (32k) continua limitando a entrada.
          config.custom_model_max_tokens: "1048576"
          # O fallback padrão (gpt-6-luna) não tem chave e sempre falha; use um modelo do OpenRouter.
          config.fallback_models: '["openrouter/anthropic/claude-haiku-5.5"]'
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG__RESPONSE_LANGUAGE: "pt-BR"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested"]'
          # Em pushes (synchronize) roda só describe + review; o /improve, mais lento, fica para a abertura do PR.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/describe", "/review"]'
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests (100% coverage enforced)
        run: bun run test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Só valida o build: sem push e sem exportar a imagem (exportar levava ~50s).
      # As camadas vêm do cache do GHA (o da main serve de base para os PRs).
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=integra
          cache-to: type=gha,scope=integra,mode=max
